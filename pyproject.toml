[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elliptic-descent"
version = "0.3.0"
description = "Certified relative 4-descent for irreducible quartics over the rationals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Christopher D. Long"}]
keywords = ["elliptic curves", "descent", "number theory", "genus-one curves"]
dependencies = ["sympy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
