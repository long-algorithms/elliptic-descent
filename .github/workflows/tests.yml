name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python benchmarks/geometry.py --repeats 1 --verify
      - run: python benchmarks/foundation.py --repeats 1 --verify > foundation-results.jsonl
      - run: python benchmarks/etale.py --repeats 1 --verify > etale-results.jsonl
      - run: python benchmarks/marked_models.py --repeats 1 --verify > marked-models-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-python-${{ matrix.python-version }}
          path: |
            foundation-results.jsonl
            etale-results.jsonl
            marked-models-results.jsonl
  sage:
    name: sage (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            pytest_args: --ignore=tests/test_sage_four_selmer_group.py --ignore=tests/test_sage_cassels_tate.py --ignore=tests/test_sage_pairing_radical.py --ignore=tests/test_sage_four_selmer_fibres.py
          - group: pairing
            pytest_args: tests/test_sage_cassels_tate.py
          - group: radical
            pytest_args: tests/test_sage_pairing_radical.py
          - group: fibres-fixtures
            pytest_args: tests/test_sage_four_selmer_fibres.py -k "explicit_global_fibres"
          - group: fibres-behaviour
            pytest_args: tests/test_sage_four_selmer_fibres.py -k "not explicit_global_fibres and not zero_fibre_transport"
          - group: fibres-reference
            pytest_args: tests/test_sage_four_selmer_fibres.py -k "zero_fibre_transport"
          - group: group-curve-0
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_0"
          - group: group-curve-1
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_1"
          - group: group-curve-2
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_2"
          - group: group-curve-3
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_3"
          - group: group-curve-4
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_4"
          - group: group-curve-5
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_5"
          - group: group-curve-6
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_6"
          - group: group-curve-7
            pytest_args: tests/test_sage_four_selmer_group.py -k "group_case_7"
          - group: group-behaviour
            pytest_args: tests/test_sage_four_selmer_group.py -k "not complete_group_on_the_actual_covering_classes"
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: /home/sage/sage/sage -pip install -e '.[test]'
      - run: /home/sage/sage/sage -python -c "import sage.all; import sympy; print(sage.all.version())"
      # Disjoint groups cover the entire suite; no test is disabled or relaxed.
      - run: /home/sage/sage/sage -python -u tools/diagnose_run.py module pytest -vv -s --durations=20 --junitxml=sage-${{ matrix.group }}.xml ${{ matrix.pytest_args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sage-tests-${{ matrix.group }}
          path: sage-${{ matrix.group }}.xml
  sage-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: /home/sage/sage/sage -pip install -e '.[test]'
      - run: /home/sage/sage/sage -python -c "import sage.all; import sympy; print(sage.all.version())"
      - run: /home/sage/sage/sage -python benchmarks/foundation.py --sage --repeats 1 --verify > sage-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/relative.py --verify --repeats 1 > relative-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/etale.py --sage --repeats 1 --verify > etale-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/two_quadratic.py --verify --repeats 1 > two-quadratic-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/rational_root.py --verify --repeats 1 > rational-root-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/release_audit.py > release-audit.json
      - run: /home/sage/sage/sage -python benchmarks/marked_models.py --sage --repeats 1 --verify > marked-models-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/two_selmer.py --verify > two-selmer-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/selmer_quartics.py --verify > selmer-quartics-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/cassels_tate.py --verify > cassels-tate-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/replay_pairing.py cassels-tate-results.jsonl > pairing-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: descent-sage-10.6
          path: |
            sage-results.jsonl
            relative-results.jsonl
            etale-results.jsonl
            two-quadratic-results.jsonl
            rational-root-results.jsonl
            release-audit.json
            marked-models-results.jsonl
            two-selmer-results.jsonl
            selmer-quartics-results.jsonl
            cassels-tate-results.jsonl
            pairing-replay.json
