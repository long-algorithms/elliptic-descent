name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python benchmarks/geometry.py --repeats 1 --verify
      - run: python benchmarks/foundation.py --repeats 1 --verify > foundation-results.jsonl
      - run: python benchmarks/etale.py --repeats 1 --verify > etale-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-python-${{ matrix.python-version }}
          path: |
            foundation-results.jsonl
            etale-results.jsonl
  sage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: /home/sage/sage/sage -pip install -e '.[test]'
      - run: /home/sage/sage/sage -python -c "import sage.all; import sympy; print(sage.all.version())"
      - run: /home/sage/sage/sage -python -m pytest -q
      - run: /home/sage/sage/sage -python benchmarks/foundation.py --sage --repeats 1 --verify > sage-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/relative.py --verify --repeats 1 > relative-results.jsonl
      - run: /home/sage/sage/sage -python benchmarks/etale.py --sage --repeats 1 --verify > etale-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: descent-sage-10.6
          path: |
            sage-results.jsonl
            relative-results.jsonl
            etale-results.jsonl
