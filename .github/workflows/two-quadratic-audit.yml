name: Two-quadratic arithmetic audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Archive checkout source for audit replay
        run: |
          /home/sage/sage/sage -python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          paths = sorted(p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts)
          with ZipFile('source-snapshot.zip', 'w', ZIP_DEFLATED) as archive:
              for path in paths:
                  archive.write(path, path.as_posix())
          Path('source-revision.txt').write_text(os.environ['GITHUB_SHA']+'\n')
          PY
      - run: /home/sage/sage/sage -pip install -e .
      - run: /home/sage/sage/sage -python benchmarks/export_two_quadratic_arithmetic.py --output two-quadratic-arithmetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-quadratic-arithmetic-and-source
          path: |
            source-snapshot.zip
            source-revision.txt
            two-quadratic-arithmetic/*.json
