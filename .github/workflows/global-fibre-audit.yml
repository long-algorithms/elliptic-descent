name: Global fibre audit
on:
  push:
    paths:
      - 'src/**'
      - 'benchmarks/four_selmer_fibres.py'
      - 'benchmarks/replay_fibres.py'
      - '.github/workflows/global-fibre-audit.yml'
  pull_request:
permissions:
  contents: read
jobs:
  fibres:
    name: fibres (${{ matrix.fixture }})
    strategy:
      fail-fast: false
      matrix:
        fixture: [rank_one, split_two_torsion, cyclic_two_torsion, cyclic_four_torsion, full_two_and_four, zero_selmer, nontrivial_sha_571a1, split_nontrivial_radical]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: /home/sage/sage/sage -pip install -e '.[test]'
      - run: /home/sage/sage/sage -python benchmarks/four_selmer_fibres.py --fixture ${{ matrix.fixture }} --verify > four-selmer-fibres-${{ matrix.fixture }}.jsonl
      - run: /home/sage/sage/sage -python benchmarks/replay_fibres.py four-selmer-fibres-${{ matrix.fixture }}.jsonl > fibre-replay-${{ matrix.fixture }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-four-selmer-fibres-${{ matrix.fixture }}
          path: |
            four-selmer-fibres-${{ matrix.fixture }}.jsonl
            fibre-replay-${{ matrix.fixture }}.json
