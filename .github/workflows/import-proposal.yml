name: Prune duplicate PR6 verification runs
on:
  push:
    branches: [verification/import-v05-pr6-proposal]
permissions:
  actions: write
  contents: read
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep PR checks and cancel only same-head push duplicates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = 'long-algorithms/elliptic-descent'
          head = 'b2016354477ba185db2460b42f659a8c9d4322ea'
          branch = 'feature/v0.5-four-selmer-group-cocycles'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          url = base + '/actions/runs?head_sha=' + head + '&event=push&per_page=100'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              runs = json.load(response)['workflow_runs']
          for run in runs:
              if (run['head_sha'] != head or run['head_branch'] != branch
                      or run['event'] != 'push' or run['status'] == 'completed'):
                  continue
              request = urllib.request.Request(base + '/actions/runs/' + str(run['id']) + '/cancel',
                                               data=b'', headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request) as response:
                      print('Cancelled duplicate push run', run['id'], run['name'], response.status)
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print('Run already finished', run['id'])
          print('PR-event checks and all other branches/revisions were left unchanged.')
          PY
