name: Diagnostic reduced primitive-element probe
on:
  push:
    branches: [verification/import-v05-pr6-proposal]
permissions:
  contents: read
jobs:
  reduced:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [full_two_and_four, split_nontrivial_radical]
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ee5640f0b98bec1925c168bdce5d289224dd0b30
          path: source
      - run: /home/sage/sage/sage -pip install -e './source[test]'
      - name: Reduced primitive element and unchanged exact proof (diagnostic only)
        run: timeout 900 /home/sage/sage/sage -python -u optimized_field_probe.py "$GITHUB_WORKSPACE/source" ${{ matrix.fixture }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reduced-diagnostic-${{ matrix.fixture }}
          path: |
            reduced-progress.jsonl
            reduced-unverified-evidence.json
