name: Pinned PR6 Sage probe
on:
  push:
    branches: [verification/import-v05-pr6-proposal]
permissions:
  contents: read
jobs:
  normal-field-eight-classes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2016354477ba185db2460b42f659a8c9d4322ea
      - run: /home/sage/sage/sage -pip install -e '.[test]'
      - name: Test the eight-class case with genuine field discovery
        run: /home/sage/sage/sage -python -u tools/diagnose_run.py module pytest tests/test_sage_four_selmer_group.py -k group_case_4 -vv -s --durations=5 --junitxml=pinned-eight-class.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-pr6-eight-class-test
          path: pinned-eight-class.xml
