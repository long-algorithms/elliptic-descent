name: Four-Selmer group audit
on:
  push:
    paths:
      - 'src/**'
      - 'tests/test_sage_theta_group.py'
      - 'tests/test_exponent_four.py'
      - '.github/workflows/four-selmer-group-audit.yml'
  pull_request:
permissions:
  contents: read
jobs:
  exact-theta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: /home/sage/sage/sage -pip install -e '.[test]'
      - run: /home/sage/sage/sage -python -u tools/diagnose_run.py module pytest tests/test_sage_theta_group.py tests/test_exponent_four.py -v -s --durations=15 --junitxml=theta-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-theta-tests
          path: theta-tests.xml
