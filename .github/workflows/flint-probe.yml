name: Exact FLINT arithmetic probe
on:
  push:
    branches: [verification/pr6-flint-probe]
permissions:
  contents: read
jobs:
  exact-polynomials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [full_two_and_four, split_nontrivial_radical]
    container:
      image: sagemath/sagemath:10.6@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      options: --user root
    env:
      ELLIPTIC_DESCENT_REQUIRE_SAGE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SYMPY_GROUND_TYPES: flint
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee5640f0b98bec1925c168bdce5d289224dd0b30
      - run: /home/sage/sage/sage -pip install -e '.[test]' 'python-flint==0.8.0'
      - name: Assert the exact arithmetic engine
        run: |
          /home/sage/sage/sage -python - <<'PY'
          import sympy as s
          from sympy.external.gmpy import GROUND_TYPES
          import flint
          x=s.Symbol('x')
          K=s.QQ.algebraic_field((s.Poly(x*x-2,x),x))
          print('SymPy',s.__version__,'FLINT',flint.__version__,'ground',GROUND_TYPES,'polynomial',type(K.unit._rep))
          assert GROUND_TYPES=='flint'
          PY
      - name: Fresh original-source group benchmark without relaxed checks
        run: /home/sage/sage/sage -python -u benchmarks/four_selmer_group.py --fixture ${{ matrix.fixture }} --verify > group-${{ matrix.fixture }}.jsonl
      - name: Independent exact-evidence replay
        run: /home/sage/sage/sage -python benchmarks/replay_four_group.py group-${{ matrix.fixture }}.jsonl > replay-${{ matrix.fixture }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flint-diagnostic-${{ matrix.fixture }}
          path: |
            group-${{ matrix.fixture }}.jsonl
            replay-${{ matrix.fixture }}.jsonl
