name: Distribution audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wheel-and-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'setuptools>=77.0.3' build 'pytest>=8,<10'
      - run: python -m build
      - run: python tools/check_distribution.py --directory dist
      - run: python -m pip install dist/*.whl
      - name: Test the installed wheel outside the source checkout
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import os
          import elliptic_descent as ed
          assert ed.__version__ == version('elliptic-descent') == '0.5.0'
          assert not Path(ed.__file__).resolve().is_relative_to(Path(os.environ['GITHUB_WORKSPACE']).resolve())
          D = ed.construct_four_cover((1,-1,0,0,1), (0,-1,0,0))
          assert D.check_construction()
          C = ed.RationalRootIdentification((4,0,-5,0,1))
          assert C.check_marked_map()
          print(ed.__file__)
          PY
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q
      - name: Verify that the source distribution rebuilds
        run: python -m pip wheel --no-deps --no-build-isolation dist/*.tar.gz --wheel-dir rebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: elliptic-descent-0.5.0-distributions
          path: dist/*
  minimum-sympy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test]' 'sympy==1.13.0'
      - run: python -m pytest -q
